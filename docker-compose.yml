services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gather_rentals
      POSTGRES_USER: gather_rentals
      POSTGRES_PASSWORD: rentals_local_only
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - gather_rentals_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gather_rentals -d gather_rentals"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  gather_rentals_pgdata:
